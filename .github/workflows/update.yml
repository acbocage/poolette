name: Poolette - mise à jour des horaires et déploiement

on:
  schedule:
    - cron: "0 3 * * *"    # chaque jour, ~4h (hiver) / 5h (été) à Paris
    - cron: "0 11 * * *"   # puis ~12h / 13h pour les annonces de dernière minute
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poolette
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mettre à jour les horaires et le calendrier
        run: python scripts/update_data.py
        env:
          # Facultatif mais nécessaire pour L'Union, les exceptions « En bref » et les pages libres.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "poolette-bot"
          git config user.email "poolette-bot@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des horaires"
            # Si main a avancé entre-temps (autre exécution, relance), on repart de la dernière version
            # en gardant les données fraîchement générées.
            git pull --rebase -X theirs origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Le déploiement tourne dans un job séparé : l'API d'artefacts de GitHub est parfois en retard de
  # quelques secondes ("No artifacts named github-pages were found"), ce qui faisait échouer le run
  # alors que l'envoi de l'artefact avait réussi. On laisse aussi une seconde chance après une pause.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause avant nouvel essai
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
